<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Планети — Лаба 2 + Лаба 3</title>

  <!-- Ionic core -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />

  <!-- Ionicons -->
  <script type="module" src="https://unpkg.com/ionicons/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons/dist/ionicons/ionicons.js"></script>

  <style>
    ion-content {
      --background: #f4f5f8;
    }
    .planet-img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 12px 0;
    }
  </style>
</head>

<body>
<ion-app>

  <!-- Роутер: хеш-режим, щоб дружити з Live Server / GitHub Pages -->
  <ion-router use-hash="true">
    <ion-route url="/" component="page-home"></ion-route>
    <ion-route url="/planet/:name" component="page-planet"></ion-route>
  </ion-router>

  <ion-router-outlet></ion-router-outlet>

  <!-- FAB-кнопка: плаваюча, доступна на всіх сторінках -->
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button id="add-planet-modal">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <!-- Модальне вікно додавання планети -->
  <ion-modal trigger="add-planet-modal">
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-button id="close-add-planet-modal">Закрити</ion-button>
        </ion-buttons>
        <ion-title>Додати нову планету</ion-title>
        <ion-buttons slot="end">
          <ion-button id="confirm-add-planet">Додати</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      <ion-list>
        <ion-item>
          <ion-label position="stacked">Назва планети *</ion-label>
          <ion-input id="planetName" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Посилання на зображення *</ion-label>
          <ion-input id="planetImage" required></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Опис *</ionlabel>
          <ion-textarea id="planetDescription" required></ion-textarea>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Температура</ion-label>
          <ion-input id="planetTemperature"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Маса</ion-label>
          <ion-input id="planetMass"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Відстань від Сонця</ion-label>
          <ion-input id="planetDistance"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Рік відкриття</ion-label>
          <ion-input id="planetDiscovery"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Атмосфера</ion-label>
          <ion-input id="planetAtmosphere"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Супутники (через кому)</ion-label>
          <ion-textarea id="planetSatellites"></ion-textarea>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Місії (через кому)</ion-label>
          <ion-textarea id="planetMissions"></ion-textarea>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-modal>

</ion-app>

<!-- Логіка додатку -->
<script type="module" src="app.js"></script>
<script type="module" src="addPlanetModal.js"></script>
</body>
</html>
